name: Update Paradox Plugin Manifest

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-paradox-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and validate manifest
        shell: bash
        run: |
          set -euo pipefail

          URL="https://www.iamparadox.dev/jellyfin/plugins/manifest.json"
          FILE="paradox-plugins/manifest.json"
          TMP="$(mktemp)"

          trap 'rm -f "$TMP"' EXIT

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            "$URL" -o "$TMP"

          python - "$TMP" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list) or not data:
              raise SystemExit("Invalid manifest: expected a non-empty JSON list")

          for plugin in data:
              if not isinstance(plugin, dict):
                  raise SystemExit("Invalid manifest: plugin entry is not an object")
              if not plugin.get("guid") or not plugin.get("name"):
                  raise SystemExit("Invalid manifest: missing plugin GUID or name")

          print(f"Validated {len(data)} plugin entries.")
          PY

          mkdir -p "$(dirname "$FILE")"

          if ! cmp -s "$TMP" "$FILE"; then
            cp "$TMP" "$FILE"
            echo "MANIFEST_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "Manifest unchanged."
          fi

      - name: Commit updated manifest
        if: env.MANIFEST_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add paradox-plugins/manifest.json
          git commit -m "Update Paradox plugin manifest"
          git push
